# Base configuration used by automated tests.

# ============================================================================
# EXECUTION ENVIRONMENT / PROJECT DIRECTORIES
# ============================================================================
executionEnvironment=LOCAL
inputDirectory=input
resultDirectory=result

# ============================================================================
# BATCH OUTPUT
# ============================================================================
output.batchLabel=TEST_SUITE
output.consoleProgressInterval=1000

# ============================================================================
# SOLUTION VALIDATION
# ============================================================================
validation.finalSolution=true
# Independent exact scheduling check after search (required certificate for deterministic runs).
validation.finalExactSchedule=true
# Independent high-replication Monte Carlo validation of the final frozen 3M solution.
validation.finalMonteCarlo=true
# Detailed route/node/arc diagnostics. In stochastic runs this also adds the optional free-exact schedule comparison.
schedulingDiagnosticsDetailed=false
validation.saCheckpointInterval=0

# ============================================================================
# PROBLEM VARIANT AND EVALUATION MODE
# ============================================================================
# Options: 3M-2E-VRP, DELLAERT-2E-VRP
problemVariant=3M-2E-VRP

# Options: DETERMINISTIC, STOCHASTIC
# DELLAERT-2E-VRP supports deterministic evaluation only.
evaluationMode=DETERMINISTIC

# Required only for stochastic evaluation. Options: CCM, PBM
# stochasticMode=CCM

numberOfDepots=2
numberOfParkingLocations=3
failureProbability=0.05

# ============================================================================
# EXPERIMENT RANGE AND RANDOM SEEDS
# ============================================================================
customerCountStart=50
customerCountEnd=50
sampleIndexStart=2
sampleIndexEnd=2
searchSeedStart=1230
numberOfRuns=1
distributionSeed=0

# ============================================================================
# INITIALIZATION AND SEARCH EFFORT
# ============================================================================
initialSolutionAttempts=20
maxSaIterations=1
numberOfOperators=18
maxLnsIterations=100
operatorRepetitions=5
initialDeparturePositionRatio=1.0

# ============================================================================
# VIRTUAL MEETING COPIES
# ============================================================================
initialVirtualMeetingCopiesPerCustomer=1.0
dynamicVirtualMeetingCopiesEnabled=true
dynamicVirtualMeetingCopiesMultiplier=3

# ============================================================================
# OPERATOR ADAPTATION
# ============================================================================
adaptiveOperatorWeightsEnabled=true
operatorWeightResetInterval=3000
operatorInitialWeight=0.01

# ============================================================================
# SCHEDULING / FEASIBILITY CONTROLS
# ============================================================================
# Options: APPROXIMATE, EXACT.
# DELLAERT-2E-VRP requires APPROXIMATE.
schedulingMode=APPROXIMATE
routeScoreInfeasibilityPenalty=5.0
timeFeasibilityTolerance=0.001
feasibleMeetingTimeTolerance=0.001
minimumPositiveDepartureTime=0.001
# Shared by deterministic DAS repair, CCM departure repair, and PBM recourse adjustment.
departureReductionFactor=0.5
routeStartTighteningEnabled=true
recourseRelativeImprovementTolerance=0.001

# ============================================================================
# SIMULATED ANNEALING CALIBRATION
# ============================================================================
saInitialAcceptanceProbability=0.999
saFinalAcceptanceProbability=0.001

# ============================================================================
# STOCHASTIC DISTRIBUTIONS / SAS APPROXIMATION
# ============================================================================
# Options: CLIPPING, TRUNCATION
stochasticTailStrategy=TRUNCATION
stochasticLowerQuantile=0.05
stochasticUpperQuantile=0.95
cdfGridPoints=15
previousArrivalSubIntervals=2
serviceTimeCvMin=0.11
serviceTimeCvMax=0.31
travelTimeCvMin=0.21
travelTimeCvMax=0.31
zeroDistanceTravelCv=0.00001
minimumLognormalValue=0.00001

# ============================================================================
# STOCHASTIC EVALUATOR / MONTE CARLO
# ============================================================================
# Options: SAS, SIMULATION
stochasticEvaluator=SAS
simulationSearchReplications=100
finalSimulationReplications=1000
simulationThreads=1
# Direct Monte Carlo seeds; these are used exactly as written.
simulationSearchSeed=987654321
finalSimulationSeed=123456789
# Reuse primitive-aligned random scenarios when comparing stochastic alternatives.
simulationUseCommonRandomNumbers=true


simulationLatenessTolerance=0.001
simulationZeroTimeEpsilon=0.0000000000000001

# ============================================================================
# COST / SENSITIVITY COEFFICIENTS
# ============================================================================
hourlyWageCoefficient=1.0
fuelCostCoefficient=1.0
penaltyCoefficient=1.0

# ============================================================================
# MEETING-POINT ACCESSIBILITY
# ============================================================================
# Options: FULL, PARKING_ONLY, OUTER_ZONE. DELLAERT-2E-VRP requires PARKING_ONLY.
meetingPointAccessibility=PARKING_ONLY
outerZoneRadiusKm=2.5
cityCenterX=0.0
cityCenterY=0.0

# ============================================================================
# DETERMINISTIC TIME MODEL
# ============================================================================
# Options: MEAN, ROBUST_QUANTILE. DELLAERT-2E-VRP requires MEAN.
deterministicTimeMode=MEAN
robustQuantile=0.95
