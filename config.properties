# ============================================================================
# SAS-ALNS CONFIGURATION
# Base file: stochastic CCM run for 2 depots, 3 parking locations, 50 customers.
# See README.md for the four medium/large instance groups used in the paper.
# ============================================================================

# ---------------------------------------------------------------------------
# 1) EXPERIMENT SETUP
# ---------------------------------------------------------------------------

# Execution label recorded in the output. Options: LOCAL | CLOUD
executionEnvironment=LOCAL

# Short name used to identify the output batch.
output.batchLabel=CCM-2-3-50

# Problem family; selects input/<problemVariant>/.
# Options: 3M-2E-VRP | DELLAERT-2E-VRP
problemVariant=3M-2E-VRP

# Evaluation regime. Options: DETERMINISTIC | STOCHASTIC
evaluationMode=STOCHASTIC

# Stochastic formulation. Options: CCM | PBM
# Required for STOCHASTIC; comment this line out for DETERMINISTIC runs.
stochasticMode=CCM

# Search-time stochastic evaluator. Options: SAS | SIMULATION
stochasticEvaluator=SAS

# Search scheduler. Stochastic runs use APPROXIMATE (DAS).
# EXACT keeps the Gurobi scheduler available for deterministic generation/verification.
# Options: APPROXIMATE | EXACT
schedulingMode=APPROXIMATE

# Instance selection: 3M-Cb-<depots>-<parkings>-<customers>-<sample>.txt
numberOfDepots=2
numberOfParkingLocations=3
customerCountStart=50
customerCountEnd=50
sampleIndexStart=1
sampleIndexEnd=5

# Independent runs use consecutive seeds starting here (1230-1239 for 10 runs).
searchSeedStart=1230
numberOfRuns=10

# CCM maximum failure probability; 0.05 means a 95% success requirement.
failureProbability=0.05

# PBM failed-delivery penalty multiplier; 1.0 is the base case.
penaltyCoefficient=1.0

# Meeting-point availability. Options: FULL | PARKING_ONLY | OUTER_ZONE
meetingPointAccessibility=FULL
# Used by OUTER_ZONE: candidates inside this radius are excluded.
outerZoneRadiusKm=2.5
cityCenterX=0.0
cityCenterY=0.0

# Deterministic duration rule. Options: MEAN | ROBUST_QUANTILE
# ROBUST_QUANTILE is the conservative deterministic benchmark.
deterministicTimeMode=MEAN
# Quantile within the active truncated distribution when ROBUST_QUANTILE is used.
robustQuantile=0.95

# Cost multipliers; 1.0 keeps the benchmark values unchanged.
hourlyWageCoefficient=1.0
fuelCostCoefficient=1.0

# ---------------------------------------------------------------------------
# 2) SEARCH EFFORT
# ---------------------------------------------------------------------------

# Maximum attempts to construct an initial feasible solution.
initialSolutionAttempts=100

# Number of simulated-annealing phases (maxSA in the paper).
maxSaIterations=5

# ALNS iterations per SA phase (maxALNS); 5 x 600 = 3000 total iterations.
maxLnsIterations=600

# Trials of the selected operator pair (maxU): 40 for 50 customers, 60 for 100.
operatorRepetitions=40

# Number of operators enabled from the implemented portfolio.
numberOfOperators=18

# Initial departure position within its feasible interval: 0=earliest, 1=latest.
initialDeparturePositionRatio=1.0

# ---------------------------------------------------------------------------
# 3) OUTPUT AND VALIDATION
# ---------------------------------------------------------------------------

# Structural validation of the final solution.
validation.finalSolution=true

# Optional exact deterministic schedule check (uses Gurobi).
validation.finalExactSchedule=false

# Independent Monte Carlo validation of each final stochastic solution.
validation.finalMonteCarlo=true

# Validate the incumbent every N completed SA phases; 0 disables this check.
validation.saCheckpointInterval=1

# Extra detailed scheduling diagnostics; normally false.
schedulingDiagnosticsDetailed=false

# Console progress interval in ALNS iterations.
output.consoleProgressInterval=600

# Input and output roots; relative paths are resolved from the working directory.
inputDirectory=input
resultDirectory=result

# ---------------------------------------------------------------------------
# 4) ADAPTIVE SEARCH AND SIMULATED ANNEALING
# ---------------------------------------------------------------------------

# Enable adaptive roulette-wheel operator selection.
adaptiveOperatorWeightsEnabled=true

# Reset operator weights after this many ALNS iterations.
operatorWeightResetInterval=600

# Common initial operator weight.
operatorInitialWeight=0.01

# Target initial/final acceptance probabilities used to calibrate SA temperature.
saInitialAcceptanceProbability=0.999
saFinalAcceptanceProbability=0.001

# ---------------------------------------------------------------------------
# 5) DAS / MEETING-POINT SETTINGS
# Normally keep these fixed unless testing the scheduling mechanism.
# ---------------------------------------------------------------------------

# Initial virtual meeting copies as a fraction of customer count.
initialVirtualMeetingCopiesPerCustomer=1.0

# Allow additional virtual copies; multiplier controls the expansion amount.
dynamicVirtualMeetingCopiesEnabled=true
dynamicVirtualMeetingCopiesMultiplier=3

# Penalty used when scoring temporally infeasible intermediate routes.
routeScoreInfeasibilityPenalty=1.0

# Scheduling and synchronization numerical tolerances.
timeFeasibilityTolerance=0.001
feasibleMeetingTimeTolerance=0.001
minimumPositiveDepartureTime=0.001

# Departure-time update rule: d <- departureReductionFactor * d.
departureReductionFactor=0.5

# Optional extra route-start tightening; disabled in the reported setting.
routeStartTighteningEnabled=false

# PBM stopping tolerance for relative objective improvement during departure adjustment.
recourseRelativeImprovementTolerance=0.001

# ---------------------------------------------------------------------------
# 6) STOCHASTIC DISTRIBUTIONS AND SAS
# ---------------------------------------------------------------------------

# Primitive-distribution tail treatment. Options: TRUNCATION | CLIPPING
stochasticTailStrategy=TRUNCATION

# Retained quantiles of the parent log-normal distribution; base case is 5%-95%.
stochasticLowerQuantile=0.05
stochasticUpperQuantile=0.95

# Seed used for reproducible CV assignment to nodes/arcs.
distributionSeed=0

# SAS numerical resolution used in the paper.
cdfGridPoints=20
previousArrivalSubIntervals=2

# Base coefficient-of-variation ranges.
serviceTimeCvMin=0.11
serviceTimeCvMax=0.31
travelTimeCvMin=0.21
travelTimeCvMax=0.31

# Small positive safeguards for zero-distance and log-normal calculations.
zeroDistanceTravelCv=0.00001
minimumLognormalValue=0.00001

# ---------------------------------------------------------------------------
# 7) MONTE CARLO SETTINGS
# ---------------------------------------------------------------------------

# Replications per candidate when stochasticEvaluator=SIMULATION.
simulationSearchReplications=100

# Replications for independent final validation used in the paper.
finalSimulationReplications=100000

# Number of simulation worker threads.
simulationThreads=1

# Separate seeds for search-time MC and independent final validation.
simulationSearchSeed=1230
finalSimulationSeed=987654321

# Use the same random-number stream when comparing candidate solutions.
simulationUseCommonRandomNumbers=true

# Simulator numerical tolerances.
simulationLatenessTolerance=0.001
simulationZeroTimeEpsilon=0.0000000000000001
